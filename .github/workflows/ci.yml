name: CI

on:
  push:
    branches: [main]
  pull_request: # mỗi PR đều phải pass test trước khi merge

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build # type-check (tsc) + build
      - run: npm run test:run # Vitest: unit + component

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium # browser + thư viện hệ thống Linux
      - run: npm run e2e # CI=true được GitHub set sẵn -> retries: 2
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }} # vẫn upload report khi test fail để debug
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [unit, e2e] # chỉ deploy khi CẢ HAI job test pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
